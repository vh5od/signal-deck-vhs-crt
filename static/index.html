<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signal Deck</title>
    <link rel="stylesheet" href="/styles.css?v=2" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="identity">
          <span class="signal-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <div>
            <h1>Signal Deck</h1>
            <p>VHS × CRT signal processor</p>
          </div>
        </div>
        <div class="top-actions">
          <span class="source-pill" id="sourcePill"><i></i><span id="sourceLabel">正在读取视频…</span></span>
          <input id="sourceInput" type="file" accept="video/mp4,video/quicktime,video/x-m4v,video/webm,video/x-matroska" hidden />
          <button class="source-button" id="sourceButton" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h9l2 2h5v12H4V5zm8 4v3H9l3.8 4L17 12h-3V9h-2z" /></svg>
            <span>更换视频</span>
          </button>
          <button class="quiet-button" id="saveButton">保存参数</button>
          <button class="render-button" id="renderButton">
            <span>渲染成片</span>
            <i aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <main class="workspace">
        <section class="viewer-column" aria-label="视频预览">
          <div class="monitor">
            <div class="monitor-label">
              <span>Live composite</span>
              <span id="resolutionLabel">1024 × 576</span>
            </div>
            <div class="screen-wrap" id="screenWrap">
              <canvas id="previewCanvas"></canvas>
              <video id="sourceVideo" src="/media/source" playsinline loop crossorigin="anonymous"></video>
              <div class="screen-glass" aria-hidden="true"></div>
              <div class="preview-message" id="previewMessage">正在初始化实时预览…</div>
              <div class="upload-overlay" id="uploadOverlay" hidden>
                <strong id="uploadTitle">正在导入视频</strong>
                <span id="uploadDetail">0%</span>
                <div><i id="uploadProgress"></i></div>
              </div>
            </div>
            <div class="transport">
              <button id="playButton" class="play-button" aria-label="播放或暂停">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
              </button>
              <span class="timecode" id="timecode">00:00.00</span>
              <div class="timeline" id="timeline" role="slider" tabindex="0" aria-label="播放进度">
                <div class="timeline-fill" id="timelineFill"></div>
                <div class="timeline-head" id="timelineHead"></div>
              </div>
              <span class="duration" id="durationLabel">00:00.00</span>
              <button class="compare-button" id="compareButton" title="按住查看原片">按住对比</button>
              <button class="sound-button" id="soundButton" aria-label="静音或恢复声音">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.5-2.87v5.74A3.5 3.5 0 0 0 15.5 12z" /></svg>
              </button>
            </div>
          </div>

          <div class="render-strip" id="renderStrip">
            <div class="render-copy">
              <span class="status-light"></span>
              <div>
                <strong id="renderStatus">准备就绪</strong>
                <span id="renderDetail">参数变化会立即显示在预览中</span>
              </div>
            </div>
            <div class="progress-track"><i id="progressBar"></i></div>
            <a class="output-link" id="outputLink" href="/media/output" target="_blank" hidden>查看成片</a>
          </div>

          <div class="signal-note">
            <span>信号路径</span>
            <p>平成翻录 → YIQ 色度拖尾 → 磁带波动 → CRT 曲率 → 磷光辉光 → 扫描线</p>
          </div>
        </section>

        <aside class="control-column">
          <div class="preset-rail">
            <div>
              <span>预设</span>
              <strong id="presetName">平衡信号</strong>
            </div>
            <div class="preset-buttons" role="group" aria-label="效果预设">
              <button data-preset="balanced" class="active">平衡</button>
              <button data-preset="tape">磁带损伤</button>
              <button data-preset="heisei">平成 VHS</button>
              <button data-preset="heisei_extreme">平成过载</button>
              <button data-preset="crt">干净 CRT</button>
            </div>
          </div>
          <div id="controls" class="controls"></div>
          <footer class="control-footer">
            <button id="resetButton">恢复当前预设</button>
            <span>空格播放 · 按 B 对比</span>
          </footer>
        </aside>
      </main>
    </div>
    <div class="parameter-tooltip" id="parameterTooltip" role="tooltip" hidden></div>
    <script src="/app.js?v=9"></script>
  </body>
</html>
